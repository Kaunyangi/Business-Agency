<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motion — Book Events, Flights, SGR, Buses & Stays | Always Feel Connected</title>
<meta name="description" content="Motion: East Africa's travel and events super-app. Organizers publish events with live ticketing; travelers book flights with real seat maps, SGR trains, buses across East Africa, and stays in Diani, Lamu, Naivasha and beyond — all with one Motion Pay wallet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#0C7378;--teal-deep:#085458;--teal-soft:#E3F1F1;
  --ink:#141414;--paper:#FFFFFF;--mist:#F4F3EE;--line:#E6E4DC;
  --red:#DC3A21;--blue:#6C8FD6;--yellow:#F7E874;--green:#B5DF8B;
  --ok:#1E8E5A;--display:'Syne',sans-serif;--body:'Space Grotesk',sans-serif;--mono:'Space Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--body);background:var(--mist);color:var(--ink);line-height:1.5;padding-bottom:90px}
button{font-family:var(--body);cursor:pointer}
input,select{font-family:var(--body);font-size:15px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
.mono{font-family:var(--mono)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- top bar ---------- */
.topbar{background:var(--teal);color:#fff;position:sticky;top:0;z-index:80}
.tb-in{display:flex;align-items:center;justify-content:space-between;height:64px;gap:14px}
.m-logo{display:flex;align-items:center;gap:10px;font-family:var(--body);letter-spacing:.34em;font-weight:600;font-size:15px}
.m-logo .disc{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--teal);display:grid;place-items:center;font-size:8px;letter-spacing:.1em;font-weight:700}
.m-logo small{display:block;letter-spacing:.18em;font-size:8px;opacity:.85;font-weight:400}
.paychip{background:var(--teal-deep);border:1px solid rgba(255,255,255,.25);border-radius:40px;padding:7px 14px 7px 10px;display:flex;align-items:center;gap:9px;color:#fff}
.paychip .pc-ico{width:24px;height:24px;border-radius:50%;background:var(--yellow);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:11px}
.paychip b{font-family:var(--mono);font-size:13px}
.paychip span{font-size:10px;opacity:.8;display:block;line-height:1;text-transform:uppercase;letter-spacing:.08em}
.topup{background:none;border:1px dashed rgba(255,255,255,.5);color:#fff;border-radius:30px;font-size:11px;padding:4px 10px;margin-left:4px}
.topup:hover{background:rgba(255,255,255,.12)}

/* ---------- nav tabs ---------- */
.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:64px;z-index:70;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs-in{display:flex;gap:4px;min-width:max-content}
.tab{background:none;border:none;padding:15px 16px 13px;font-size:14.5px;font-weight:600;color:#6b6b6b;border-bottom:3px solid transparent;display:flex;gap:7px;align-items:center;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--teal);border-bottom-color:var(--teal)}
.tab .cnt{background:var(--red);color:#fff;font-family:var(--mono);font-size:10px;min-width:18px;height:18px;border-radius:10px;display:grid;place-items:center;padding:0 5px}

/* ---------- shared ---------- */
.view{display:none;padding:28px 0 40px;animation:fade .3s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.vhead{margin-bottom:22px}
.vhead h1{font-size:clamp(24px,3.4vw,34px);font-weight:800}
.vhead p{color:#5a5a5a;font-size:14.5px;margin-top:4px;max-width:640px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);display:block;margin-bottom:6px}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 20px}
.chip{border:1.5px solid var(--ink);background:#fff;border-radius:40px;padding:8px 16px;font-size:13.5px;font-weight:600;transition:all .15s}
.chip:hover{transform:translateY(-2px)}
.chip.on{background:var(--ink);color:#fff}
.btn{border:none;border-radius:40px;padding:13px 24px;font-weight:700;font-size:14.5px;transition:transform .15s,box-shadow .15s}
.btn.teal{background:var(--teal);color:#fff}
.btn.teal:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--yellow)}
.btn.ink{background:var(--ink);color:#fff}
.btn.ink:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--red)}
.btn.ghost{background:#fff;border:2px solid var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn.sm{padding:9px 16px;font-size:13px}
.pricebar{position:sticky;bottom:90px;background:var(--ink);color:#fff;border-radius:18px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:22px;box-shadow:0 14px 34px rgba(0,0,0,.25)}
.pricebar .tt{font-family:var(--mono);font-size:12px;color:#b8b6ae}
.pricebar .amt{font-family:var(--display);font-size:22px;font-weight:800}
.empty{border:2px dashed #cfccc2;border-radius:18px;padding:44px 20px;text-align:center;color:#8a8a84;font-size:14.5px}
.empty b{display:block;font-family:var(--display);font-size:17px;color:var(--ink);margin-bottom:6px}

/* ---------- home ---------- */
.home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.hcard{border:2px solid var(--ink);background:#fff;border-radius:20px;padding:24px;text-align:left;transition:transform .18s,box-shadow .18s;position:relative;overflow:hidden}
.hcard:hover{transform:translate(-3px,-3px)}
.hcard .hi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;margin-bottom:14px}
.hcard h3{font-size:17px;margin-bottom:4px}
.hcard p{font-size:13px;color:#5a5a5a}
.hcard .go{font-family:var(--mono);font-size:11px;margin-top:14px;display:block;color:var(--teal)}
@media(max-width:760px){.home-grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.home-grid{grid-template-columns:1fr}}

/* ---------- events grid ---------- */
.ev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.ev-card{background:#fff;border:2px solid var(--ink);border-radius:20px;overflow:hidden;text-align:left;padding:0;transition:transform .18s,box-shadow .18s;display:flex;flex-direction:column}
.ev-card:hover{transform:translate(-3px,-3px);box-shadow:7px 7px 0 var(--teal)}
.poster{aspect-ratio:4/5;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:16px;color:#fff;background-size:cover;background-position:center}
.poster .pdate{align-self:flex-start;background:#fff;color:var(--ink);border-radius:12px;padding:6px 10px;text-align:center;line-height:1.1}
.poster .pdate b{font-family:var(--display);font-size:18px;display:block}
.poster .pdate span{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.1em}
.poster .ptitle{font-family:var(--display);font-weight:800;font-size:clamp(19px,2vw,23px);line-height:1.06;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.poster .ptag{position:absolute;top:16px;right:16px;font-family:var(--mono);font-size:9px;background:var(--yellow);color:var(--ink);padding:4px 9px;border-radius:20px;letter-spacing:.08em;text-transform:uppercase}
.ev-body{padding:14px 16px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ev-body .loc{font-size:12.5px;color:#5a5a5a}
.ev-body .from{font-family:var(--mono);font-size:12px;font-weight:700;white-space:nowrap}
@media(max-width:860px){.ev-grid{grid-template-columns:1fr 1fr}}
@media(max-width:540px){.ev-grid{grid-template-columns:1fr}}

/* ---------- detail / ticket categories ---------- */
.detail{display:grid;grid-template-columns:380px 1fr;gap:26px;align-items:start}
.detail .poster{border-radius:20px;border:2px solid var(--ink);aspect-ratio:4/5}
.panel{background:#fff;border:2px solid var(--ink);border-radius:20px;padding:24px}
.panel h2{font-size:24px;font-weight:800}
.meta-row{display:flex;gap:20px;flex-wrap:wrap;margin:12px 0 4px;font-size:13.5px;color:#4a4a4a}
.meta-row b{color:var(--ink)}
.catline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.catline:last-of-type{border-bottom:none}
.catline .cn b{font-size:15.5px;display:block}
.catline .cn span{font-family:var(--mono);font-size:11px;color:#7a7a74}
.catline .cp{font-family:var(--mono);font-weight:700;font-size:14px;white-space:nowrap}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:17px;font-weight:700;line-height:1}
.stepper button:hover:not(:disabled){background:var(--yellow)}
.stepper .q{font-family:var(--mono);font-weight:700;min-width:20px;text-align:center}
.soldout{font-family:var(--mono);font-size:10px;background:#f3d9d4;color:var(--red);padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.08em}
.back{background:none;border:none;font-family:var(--mono);font-size:12px;color:var(--teal);margin-bottom:16px;letter-spacing:.06em}
@media(max-width:820px){.detail{grid-template-columns:1fr}}

/* ---------- organizer ---------- */
.org-grid{display:grid;grid-template-columns:1fr 360px;gap:26px;align-items:start}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;letter-spacing:.02em}
.field input,.field select{width:100%;border:2px solid var(--ink);border-radius:12px;padding:12px 14px;background:#fff}
.field input:focus,.field select:focus{outline:3px solid var(--teal-soft)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dropzone{border:2px dashed var(--ink);border-radius:16px;padding:26px;text-align:center;background:var(--teal-soft);cursor:pointer;transition:background .15s}
.dropzone:hover{background:#d3e9e9}
.dropzone b{font-family:var(--display)}
.dropzone span{display:block;font-size:12px;color:#4a6c6d;margin-top:4px}
.swatches{display:flex;gap:10px;margin-top:10px}
.sw{width:38px;height:38px;border-radius:12px;border:2px solid transparent;cursor:pointer}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 3px #fff inset}
.cat-edit{display:grid;grid-template-columns:1.4fr 1fr .8fr 40px;gap:10px;margin-bottom:10px}
.cat-edit input{border:2px solid var(--ink);border-radius:10px;padding:10px 12px;width:100%}
.cat-edit .del{border:none;background:#f3d9d4;color:var(--red);border-radius:10px;font-size:16px;font-weight:700}
.addcat{background:none;border:2px dashed var(--ink);border-radius:12px;padding:10px;width:100%;font-weight:600;font-size:13.5px}
.addcat:hover{background:var(--yellow)}
.org-note{font-size:12px;color:#6a6a64;background:#fff;border-left:4px solid var(--green);padding:10px 14px;border-radius:0 10px 10px 0;margin-top:14px}
@media(max-width:860px){.org-grid{grid-template-columns:1fr}}

/* ---------- transport results ---------- */
.searchbar{background:#fff;border:2px solid var(--ink);border-radius:18px;padding:16px;display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;margin-bottom:20px}
.searchbar .field{margin:0}
@media(max-width:680px){.searchbar{grid-template-columns:1fr}}
.trip-card{background:#fff;border:2px solid var(--ink);border-radius:18px;padding:18px 20px;display:grid;grid-template-columns:auto 1fr auto auto;gap:18px;align-items:center;margin-bottom:12px;transition:transform .15s,box-shadow .15s}
.trip-card:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--teal)}
.op-badge{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:15px;flex:none}
.trip-mid .rt{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.trip-mid .rt .arr{color:var(--teal)}
.trip-mid .sub{font-size:12.5px;color:#6a6a64;margin-top:2px}
.trip-tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.ttag{font-family:var(--mono);font-size:9.5px;background:var(--mist);border-radius:20px;padding:3px 9px;text-transform:uppercase;letter-spacing:.06em}
.trip-price{text-align:right}
.trip-price b{font-family:var(--mono);font-size:16px;display:block}
.trip-price span{font-size:11px;color:#7a7a74}
.seatsleft{font-family:var(--mono);font-size:10px;color:var(--ok)}
.seatsleft.low{color:var(--red)}
@media(max-width:640px){.trip-card{grid-template-columns:auto 1fr;grid-template-rows:auto auto}.trip-price{text-align:left}}

/* ---------- seat map ---------- */
.seat-wrap{display:grid;grid-template-columns:1fr 320px;gap:26px;align-items:start}
.cabin{background:#fff;border:2px solid var(--ink);border-radius:26px;padding:26px 20px;position:relative}
.cabin .nose{font-family:var(--mono);font-size:10px;text-align:center;color:#9a9a94;letter-spacing:.2em;text-transform:uppercase;margin-bottom:16px}
.seat-legend{display:flex;gap:16px;justify-content:center;margin-bottom:18px;font-size:11.5px;flex-wrap:wrap}
.seat-legend i{width:16px;height:16px;border-radius:5px;display:inline-block;vertical-align:-3px;margin-right:5px}
.rows{display:flex;flex-direction:column;gap:8px;max-width:420px;margin:0 auto}
.srow{display:flex;align-items:center;gap:8px;justify-content:center}
.srow .rn{font-family:var(--mono);font-size:10px;width:20px;color:#9a9a94;text-align:center}
.aisle{width:22px}
.seat{width:36px;height:36px;border-radius:9px 9px 5px 5px;border:2px solid var(--ink);background:#fff;font-family:var(--mono);font-size:9px;transition:transform .1s}
.seat:hover:not(:disabled){transform:scale(1.12);background:var(--teal-soft)}
.seat.taken{background:#dddbd2;border-color:#bab8ae;color:#9a9a94;cursor:not-allowed}
.seat.sel{background:var(--teal);border-color:var(--teal);color:#fff}
.seat.prem{border-color:var(--blue)}
.seat.prem.sel{background:var(--blue);border-color:var(--blue)}
@media(max-width:820px){.seat-wrap{grid-template-columns:1fr}}

/* ---------- stays ---------- */
.stay-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.stay-card{background:#fff;border:2px solid var(--ink);border-radius:20px;overflow:hidden;text-align:left;padding:0;transition:transform .18s,box-shadow .18s}
.stay-card:hover{transform:translate(-3px,-3px);box-shadow:7px 7px 0 var(--green)}
.stay-vis{height:150px;position:relative;background-size:cover}
.stay-vis .stype{position:absolute;top:12px;left:12px;font-family:var(--mono);font-size:9.5px;background:#fff;padding:4px 10px;border-radius:20px;letter-spacing:.08em;text-transform:uppercase}
.stay-vis .rate{position:absolute;bottom:12px;right:12px;background:var(--ink);color:#fff;font-family:var(--mono);font-size:10.5px;padding:5px 10px;border-radius:20px}
.stay-body{padding:14px 16px 16px}
.stay-body h3{font-size:16px}
.stay-body .loc{font-size:12.5px;color:#6a6a64;margin-top:2px}
.stay-body .amen{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
@media(max-width:860px){.stay-grid{grid-template-columns:1fr 1fr}}
@media(max-width:540px){.stay-grid{grid-template-columns:1fr}}
.room-line{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.room-line:last-of-type{border-bottom:none}
.room-line .rn b{display:block;font-size:15px}
.room-line .rn span{font-size:12px;color:#6a6a64}
.avail{font-family:var(--mono);font-size:10px;color:var(--ok)}
.avail.low{color:var(--red)}
.checkin-opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.ck{border:1.5px solid var(--ink);border-radius:12px;padding:9px 14px;font-size:12.5px;background:#fff;display:flex;gap:7px;align-items:center}
.ck.on{background:var(--teal);border-color:var(--teal);color:#fff}

/* ---------- wallet tickets ---------- */
.wallet-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:820px){.wallet-grid{grid-template-columns:1fr}}
.tkt{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 10px 26px rgba(20,20,20,.1);display:grid;grid-template-columns:1fr 128px;border:1px solid var(--line)}
.tkt-main{padding:18px 20px;position:relative}
.tkt-band{height:8px;position:absolute;top:0;left:0;right:0}
.band-event{background:repeating-linear-gradient(90deg,var(--red) 0 32px,var(--yellow) 32px 64px,var(--blue) 64px 96px,var(--green) 96px 128px)}
.band-flight{background:var(--blue)}
.band-sgr{background:var(--red)}
.band-bus{background:var(--yellow)}
.band-stay{background:var(--green)}
.tkt-type{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);margin-top:10px}
.tkt-title{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.12;margin:5px 0 10px}
.tkt-meta{display:grid;grid-template-columns:1fr 1fr;gap:7px 14px;font-size:11.5px}
.tkt-meta b{font-family:var(--mono);font-size:8.5px;text-transform:uppercase;letter-spacing:.1em;color:#9a9a94;display:block}
.tkt-foot{margin-top:12px;padding-top:10px;border-top:1px solid #efede6;display:flex;justify-content:space-between;align-items:center}
.wm{display:flex;align-items:center;gap:6px;opacity:.55}
.wm .wm-m{width:17px;height:17px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:6px;font-weight:700;letter-spacing:.04em}
.wm .wm-x{font-family:var(--mono);font-size:9px;color:#9a9a94}
.wm .wm-t{font-family:var(--display);font-weight:800;font-size:11px;position:relative}
.wm .wm-t::after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--red);top:-2px;right:-7px}
.tkt-price{font-family:var(--mono);font-size:11.5px;font-weight:700}
.tkt-stub{border-left:2px dashed #d5d2c8;background:var(--mist);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px 10px;position:relative}
.tkt-stub::before,.tkt-stub::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:var(--mist);left:-11px;border:1px solid var(--line)}
.tkt-stub::before{top:-10px}.tkt-stub::after{bottom:-10px}
.qr{width:74px;height:74px;background:
 conic-gradient(var(--ink) 25%,transparent 0 50%,var(--ink) 0 75%,transparent 0) 0 0/20px 20px,
 repeating-linear-gradient(90deg,var(--ink) 0 4px,transparent 4px 9px),
 repeating-linear-gradient(0deg,var(--ink) 0 4px,#fff 4px 9px);
 border:4px solid #fff;outline:2px solid var(--ink);border-radius:5px}
.tkt-stub .sn{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em}
.tkt-stub .st{font-family:var(--mono);font-size:8px;color:var(--ok);text-transform:uppercase;letter-spacing:.08em;text-align:center}

/* ---------- modal / checkout ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,15,15,.55);z-index:120;display:none;align-items:flex-end;justify-content:center;padding:0}
.overlay.on{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:26px 24px 30px;max-height:88vh;overflow:auto;animation:up .28s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:640px){.overlay{align-items:center;padding:20px}.sheet{border-radius:24px}}
.sheet h2{font-size:21px;margin-bottom:4px}
.sheet .sub{font-size:13px;color:#6a6a64;margin-bottom:18px}
.line-item{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.line-item span:last-child{font-family:var(--mono);font-weight:700;white-space:nowrap}
.total-line{display:flex;justify-content:space-between;padding:16px 0 6px;font-family:var(--display);font-weight:800;font-size:19px}
.paybox{background:var(--teal-soft);border:2px solid var(--teal);border-radius:14px;padding:14px 16px;margin:16px 0;display:flex;justify-content:space-between;align-items:center}
.paybox .pb-l{display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px}
.paybox .pb-ico{width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:9px;font-weight:700}
.paybox .bal{font-family:var(--mono);font-size:12px}
.paybox .bal.short{color:var(--red)}
.pm-row{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.success{text-align:center;padding:20px 6px}
.success .big{width:76px;height:76px;border-radius:50%;background:var(--green);display:grid;place-items:center;font-size:34px;margin:0 auto 16px;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:13px 22px;border-radius:40px;font-size:13.5px;z-index:200;opacity:0;pointer-events:none;transition:all .3s;box-shadow:0 10px 30px rgba(0,0,0,.3);white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast b{color:var(--yellow)}

/* ---------- bottom nav (mobile feel) ---------- */
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:90;padding:8px 6px calc(10px + env(safe-area-inset-bottom))}
.bn{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:#8a8a84;position:relative}
.bn .bi{font-size:19px;line-height:1}
.bn.on{color:var(--teal)}
.bn .cnt{position:absolute;top:-2px;right:24%;background:var(--red);color:#fff;font-family:var(--mono);font-size:9px;min-width:16px;height:16px;border-radius:9px;display:grid;place-items:center}
@media(min-width:900px){.bottomnav{display:none}body{padding-bottom:20px}.pricebar{bottom:16px}}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap tb-in">
    <div class="m-logo"><span class="disc">M</span><span>MOTION<small>ALWAYS FEEL CONNECTED</small></span></div>
    <div style="display:flex;align-items:center">
      <div class="paychip"><span class="pc-ico">₭</span><span><span>Motion Pay</span><b id="balTop">KES 0</b></span><button class="topup" id="btnTopup">+ Top up</button></div>
    </div>
  </div>
</header>

<nav class="tabs" aria-label="App sections">
  <div class="wrap tabs-in" id="tabRow">
    <button class="tab on" data-v="home">⌂ Home</button>
    <button class="tab" data-v="events">🎟 Events</button>
    <button class="tab" data-v="organizer">⬆ Organizer</button>
    <button class="tab" data-v="flights">✈ Flights</button>
    <button class="tab" data-v="sgr">🚄 SGR</button>
    <button class="tab" data-v="bus">🚌 Bus</button>
    <button class="tab" data-v="stays">🏝 Stays</button>
    <button class="tab" data-v="wallet">▤ My Tickets <span class="cnt" id="wCnt" style="display:none">0</span></button>
  </div>
</nav>

<main class="wrap">
  <section class="view on" id="v-home"></section>
  <section class="view" id="v-events"></section>
  <section class="view" id="v-organizer"></section>
  <section class="view" id="v-flights"></section>
  <section class="view" id="v-sgr"></section>
  <section class="view" id="v-bus"></section>
  <section class="view" id="v-stays"></section>
  <section class="view" id="v-wallet"></section>
</main>

<nav class="bottomnav" aria-label="Quick navigation">
  <button class="bn on" data-v="home"><span class="bi">⌂</span>Home</button>
  <button class="bn" data-v="events"><span class="bi">🎟</span>Events</button>
  <button class="bn" data-v="flights"><span class="bi">✈</span>Travel</button>
  <button class="bn" data-v="stays"><span class="bi">🏝</span>Stays</button>
  <button class="bn" data-v="wallet"><span class="bi">▤</span>Tickets<span class="cnt" id="wCnt2" style="display:none">0</span></button>
</nav>

<div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="discover.js"></script>
</body>
</html>
